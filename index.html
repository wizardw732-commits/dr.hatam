:root{--space:#03050f;--cyan:#38e8ff;--gold:#f2b84b;--violet:#8b5cf6;--ink:#eef6ff;

html{scroll-snap-type:y mandatory;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--space)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--space);color:var(--ink);font-family:"Reem Kufi","Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;min-height:100vh;min-height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(30px,6vh,56px);padding:36px 20px;overflow:hidden}
.s1{background:radial-gradient(ellipse 80% 50% at 50% 35%,rgba(30,90,200,.45),transparent 70%),radial-gradient(ellipse 60% 40% at 10% 90%,rgba(56,232,255,.18),transparent 70%)}
.s2{background:radial-gradient(ellipse 80% 50% at 50% 30%,rgba(139,92,246,.4),transparent 70%),radial-gradient(ellipse 70% 40% at 90% 90%,rgba(242,184,75,.22),transparent 70%)}

.orbit{position:absolute;inset:-34px;border-radius:50%;border:1px solid rgba(56,232,255,.55);transform:rotateX(72deg) rotateZ(0);opacity:0;transition:opacity 1.2s .9s}
.orbit::after{content:"";position:absolute;top:-6px;left:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px 4px var(--gold)}
.warp{position:absolute;left:50%;top:38%;width:160vmax;height:160vmax;margin:-80vmax;border-radius:50%;pointer-events:none;opacity:0;
background:repeating-conic-gradient(from 0deg,rgba(150,220,255,.55) 0 .4deg,transparent .4deg 6deg);-webkit-mask:radial-gradient(circle,transparent 8%,#000 30%,transparent 60%);mask:radial-gradient(circle,transparent 8%,#000 30%,transparent 60%);transform:scale(.1)}
.s1.in .pic{clip-path:circle(75% at 50% 50%);transform:none;filter:none}
.s1.in .orbit{opacity:1;animation:orb 10s linear infinite}
.s1.in .warp{animation:warp 1.6s ease-out}
@keyframes orb{to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes warp{0%{opacity:.9;transform:scale(.1)}100%{opacity:0;transform:scale(1.2)}}

/* ===== العبارات ===== */
.phrase{position:relative;margin:0;max-width:18ch;text-align:center;font-weight:700;font-size:clamp(28px,8vw,54px);line-height:1.65}
.phrase span{display:inline-block;margin:0 .12em;opacity:0;filter:blur(14px);transform:translateY(26px) scale(1.15);transition:opacity .9s,filter .9s,transform .9s;transition-delay:calc(1.1s + var(--i)*.2s)}
.s1 .phrase{color:#fff;text-shadow:0 0 22px rgba(56,232,255,.8),0 0 60px rgba(40,100,255,.6)}
.s2 .phrase{background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(242,184,75,.55))}
.s2 .phrase span{transform:translateY(-26px) scale(.85)}
.screen.in .phrase span{opacity:1;filter:blur(0);transform:none}
.hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:14px;color:var(--cyan);opacity:.75}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pic{clip-path:none!important;transform:none!important;filter:none!important}.phrase span{opacity:1;filter:none;transform:none}.orbit,.moon{opacity:1}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<section class="screen s1">
  <div class="warp"></div>
  <div class="planet"><div class="pic" role="img" aria-label="الصورة الشخصية"></div><div class="orbit"></div></div>
  <h1 class="phrase">عُقْبَى لِلْمَرَاتِبِ العُلْيَا إِنْ شَاءَ اللَّهُ</h1>
  <div class="hint">اسحب للأعلى ⌄</div>
</section>

<section class="screen s2">
  <div class="moon"></div>
  <div class="gate"><div class="pic" role="img" aria-label="الصورة الشخصية مع كتاب"></div></div>
  <h2 class="phrase">مِنْ نَجَاحٍ إِلَى رِفْعَةٍ وَتَقَدُّمٍ</h2>
</section>

<script>
document.querySelectorAll('.phrase').forEach(function(p){
  p.innerHTML=p.textContent.trim().split(/\s+/).map(function(w,i){return '<span style="--i:'+i+'">'+w+'</span>'}).join(' ');
});
var io=new IntersectionObserver(function(e){e.forEach(function(x){x.target.classList.toggle('in',x.isIntersecting)})},{threshold:.55});
document.querySelectorAll('.screen').forEach(function(s){io.observe(s)});

var c=document.getElementById('stars'),g=c.getContext('2d'),S=[],W,H,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){var d=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d;
  S=[];for(var i=0;i<140;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.3)*d,v:(Math.random()*.25+.05)*d,t:Math.random()*6})}
function draw(t){g.clearRect(0,0,W,H);
  S.forEach(function(s){s.y+=s.v;if(s.y>H)s.y=0;
    g.globalAlpha=.45+.55*Math.abs(Math.sin(t/900+s.t));g.fillStyle=s.r>1.2?'#bfeaff':'#fff';
    g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill()});
  if(!still)requestAnimationFrame(draw)}
size();addEventListener('resize',size);requestAnimationFrame(draw);
</script>
</body>
</html>
